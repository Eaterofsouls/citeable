<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citeable | Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=3">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Citeable technical reference — architecture, deterministic scoring model, AI citation sampling methodology, and API surface.">

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="context.js"></script>
  <script src="auth.js"></script>
  <script src="identity.js"></script>
  <script src="api.js"></script>
  <script src="dom.js"></script>
  <script src="nav.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="nav-container">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon"><img src="favicon.svg" alt="Citeable Logo" width="32" height="32"></div>
          <h1>Citeable</h1>
        </div>
        <nav id="main-nav"></nav>
      </aside>
    </div>

    <main class="main-content">
      <header class="topbar">
        <div class="page-title-wrap">
          <h2>Documentation &amp; Technical Reference</h2>
        </div>
        <div class="topbar-meta">
          <span class="status-pill info" id="docs-status-pill">API v1.4 Active</span>
        </div>
      </header>

      <div class="page-container docs-page-container">
        <div class="docs-triad-layout">
          
          <!-- Column 1: Left Docs Sub-Nav -->
          <aside class="docs-nav-sidebar" id="docs-nav-sidebar" aria-label="Documentation hierarchy">
            <div class="docs-nav-search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="docs-nav-filter" placeholder="Filter documentation..." aria-label="Filter documentation pages">
            </div>
            <nav id="docs-page-tree" class="docs-page-tree"></nav>
          </aside>

          <!-- Column 2: Center Editorial Canvas -->
          <div class="docs-canvas-container">
            <nav id="docs-breadcrumbs" class="docs-breadcrumbs" aria-label="Breadcrumb"></nav>
            
            <article id="docs-content" class="docs-content markdown-body" role="main" aria-label="Documentation body">
              <div class="docs-loading">
                <div class="spinner"></div>
                <span>Loading documentation...</span>
              </div>
            </article>

            <footer id="docs-pagination" class="docs-pagination" aria-label="Document pagination"></footer>
          </div>

          <!-- Column 3: Right In-Page Table of Contents -->
          <aside class="docs-toc" id="docs-toc" aria-label="Table of contents">
            <div class="docs-toc-title">On this page</div>
            <nav id="docs-toc-nav" class="docs-toc-nav"></nav>
          </aside>

        </div>
      </div>
    </main>
  </div>

  <script src="docs.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AreosNav) AreosNav.renderNav('docs');
    });
  </script>
</body>
</html>
