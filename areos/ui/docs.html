<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citeable | Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Citeable technical reference — architecture, deterministic scoring model, AI citation sampling methodology, and API surface.">

  <!-- Markdown rendering. Vendored locally (areos/ui/vendor/) rather than loaded
       from a CDN: the app's Content-Security-Policy is `script-src 'self'
       'unsafe-inline'` with no external script origins allowlisted, so a CDN
       <script src> would be silently blocked by the browser. -->
  <script src="vendor/marked.min.js"></script>
  <!-- Diagram rendering for fenced ```mermaid blocks -->
  <script src="vendor/mermaid.min.js"></script>

  <script src="context.js"></script>
  <script src="auth.js"></script>
  <script src="identity.js"></script>
  <script src="api.js"></script>
  <script src="dom.js"></script>
  <script src="nav.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Left: global sidebar navigation (rendered by nav.js into #main-nav) -->
    <div id="nav-container">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon"><img src="favicon.svg" alt="Citeable Logo" width="24" height="24"></div>
          <h1>Citeable</h1>
        </div>
        <nav id="main-nav"></nav>
      </aside>
    </div>

    <!-- Center + Right: documentation content and on-page TOC -->
    <main class="main-content">
      <div class="docs-page">
        <div class="docs-page-header">
          <h1>Citeable Documentation</h1>
          <p class="page-subtitle">Technical reference for the AI-readiness audit engine — architecture, scoring model, and API surface.</p>
          <button type="button" id="docs-toggle-all" class="docs-toggle-all-btn" aria-expanded="false">Expand all sections</button>
        </div>

        <div class="docs-layout">
          <article id="docs-content" class="markdown-body">
            <div class="docs-loading">Loading documentation&hellip;</div>
          </article>

          <aside class="docs-toc" id="docs-toc" aria-label="On this page">
            <details class="docs-toc-details">
              <summary class="docs-toc-label">On This Page</summary>
              <nav id="docs-toc-nav" class="docs-toc-nav"></nav>
            </details>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="docs.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AreosNav) AreosNav.renderNav('docs');
    });
  </script>
</body>
</html>
